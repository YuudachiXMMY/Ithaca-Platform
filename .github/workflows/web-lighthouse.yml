# ── apps/web — Lighthouse CI (mobile perf) ──────────────────────────────────────────────────
# Builds the SvelteKit app and runs `lhci autorun` against the built site. The thresholds that
# can actually fail the job live in apps/web/lighthouserc.json and are an assertMatrix of
# PER-ROUTE LCP ratchets — FOUR tiers since 2026-10-15, when the single `.*ev-team.*` pattern was
# split per locale: EN ev-team <= 6100ms, ZH ev-team <= 7800ms, other /zh <= 5800ms, everything
# else <= 4500ms — plus CLS <= 0.05. Everything else (performance 0.85, a11y 0.9, seo 0.9, FCP,
# TBT) is warn-level. lighthouserc.json is the source of truth; this comment is a signpost.
#
# ⚠️ NO LONGER RUNS ON EVERY PR/PUSH — this is a deliberate change made during the monorepo merge.
# Measured over 15 days before the merge, this workflow was 795 of the web repo's ~2,380 CI
# minutes per month (67%) and was RED on 59 of 65 runs. The redness is a real, unpaid LCP debt,
# not flakiness — but it is also not a signal anyone acts on per-PR, and the CI runner's own
# variance makes it a poor gate: three consecutive samples of `/` measured 6304 / 6509 / 10420 ms
# (±60%), against a 4500 ms ratchet.
#
# So: run it on demand and weekly, keep the ratchet EXACTLY as strict as it was, and track the
# real LCP debt as its own piece of work. Do NOT "fix" this by loosening assertMatrix — the
# config comments record that those numbers came from the author's localhost, which is faster
# than the runner, so loosening would hide regressions rather than measure them.
name: web Lighthouse

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Cron on a private repo still consumes billable minutes, so once a week.
    - cron: '0 6 * * 1'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # No placeholder auth/DB env needed: the app is stateless, so neither `npm run build` (which
    # prerenders, importing hooks.server.ts) nor the lhci server (`node build/index.js`) requires
    # any env to load. Before the Prisma/Better-Auth removal, hooks.server.ts -> auth.ts ran
    # betterAuth({ secret }) at module load and threw BetterAuthError without one.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # engine-strict off (mirrors the Docker deps stage, which never copies .npmrc):
        # camera-controls declares engines.node >=22 but only needs it at the install-time engine
        # check, so the Node 20 runner (prod parity) builds fine. Without this, .npmrc's
        # engine-strict=true turns that mismatch into an EBADENGINE abort.
        run: npm ci --engine-strict=false

      - name: Build
        env:
          PUBLIC_GA_TRACKING_ID: G-675W5PPJEJ
          PUBLIC_SITE_URL: https://ithacateens.com
        run: npm run build

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: lhci autorun

      # include-hidden-files is REQUIRED, not a nicety: `.lighthouseci` is a dot-directory,
      # and upload-artifact v4 (>=4.4) excludes hidden paths by default. Without it this step
      # reported `No files were found with the provided path` and uploaded NOTHING on every run
      # — verified zero artifacts on runs 38258795442, 38401256331 and 38660741710 — while
      # still reporting success, because `if: always()` plus `if-no-files-found: warn` makes the
      # miss a warning. The job's own red (assertion failures) hid the fact that the evidence
      # for that red was never retrievable: every verdict had to be scraped out of the raw log,
      # and the per-route LCP *element* and the TBT breakdown are only in the uploaded HTML
      # report. Do not drop this input without checking the artifact count on the next run.
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lighthouse-results
          path: apps/web/.lighthouseci
          include-hidden-files: true
