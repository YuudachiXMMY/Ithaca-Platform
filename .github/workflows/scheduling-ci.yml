# apps/scheduling (dashboard.ithacateens.com, Next.js) — PR quality gate.
#
# Monorepo note: GitHub only reads workflows from the REPOSITORY ROOT. The pre-merge original is
# in git history at apps/scheduling/.github/workflows/ci.yml.
#
# `defaults.run.working-directory` applies to `run` steps only — the buildx `uses` steps need an
# explicit `context:`, and setup-node needs `cache-dependency-path`.
name: scheduling CI

on:
  # `prod-scheduling` is listed because it had never run this workflow even once
  # (`gh run list --branch prod-scheduling` was empty at tip 93d4e3a, pushed 2026-10-13) while
  # web-ci.yml has covered `prod` all along. To be precise about what that did and did not risk:
  # that tip is a pure fast-forward of main with no commits of its own, and main's runs already
  # build the test+runtime targets of the very same Dockerfile the server builds live
  # (DEPLOY_TYPE=git-source), so released code was not untested. What was unguarded is the branch
  # itself — no ruleset, no run — so any direct push or hotfix that skips main would have become
  # the server's build input with nothing in between. Listing it on `pull_request` too covers the
  # hotfix-PR-into-the-release-branch shape of the same hole. Accepted cost: a fast-forward
  # release now re-runs the full ~8-minute docker+e2e job on a commit main already proved green.
  push:
    branches: [main, prod-scheduling]
    paths:
      - 'apps/scheduling/**'
      - '.github/workflows/scheduling-ci.yml'
  pull_request:
    branches: [main, prod-scheduling]
    paths:
      - 'apps/scheduling/**'
      - '.github/workflows/scheduling-ci.yml'
  # Needed because `paths:` has a sharp edge on release pushes: when a push introduces no new
  # commits (creating/re-creating `prod-scheduling` at a commit that already exists on main —
  # GitHub reports `before` as all-zeros and so an empty changed-file set), no path matches and
  # this workflow silently does not run. web-release.yml added workflow_dispatch for exactly that
  # (see its header). Here it is also the ONLY way to prove the release tip is green on demand:
  # scheduling has no release workflow at all, the server clones this branch and builds it.
  workflow_dispatch:

# Was missing before the merge: two quick pushes used to run two full 8-minute jobs.
concurrency:
  group: scheduling-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/scheduling

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # mirror.gcr.io rather than docker.io: GitHub runners share egress IPs, so unauthenticated
        # pulls hit Docker Hub's `toomanyrequests` limit — which shows up as "Initialize containers"
        # failing in seconds, unrelated to any code change, and a re-run does not help (the window
        # is hours). This repo has no DOCKERHUB_* secrets to authenticate with.
        #
        # mirror.gcr.io is Docker Hub's own pull-through cache, not a different publisher:
        # `docker manifest inspect` returns a byte-identical manifest (same digest) for both. Only
        # the transport changes, so this adds no new trusted party.
        #
        # Note: the Dockerfile's `node:${NODE_VERSION}` / `node:24-slim` still come from Docker Hub
        # (buildx steps below) and can hit the same limit. Deliberately not changed, because that
        # Dockerfile also builds on the server (DEPLOY_TYPE=git-source) — changing it would alter
        # production's supply chain. If that gap needs closing, add
        # `ARG NODE_REGISTRY=docker.io/library` (default unchanged) and pass the mirror only here.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: course_scheduling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d course_scheduling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/course_scheduling
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32bytes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # E2E (Playwright) reads these; the seed writes to the same Postgres the app:prod container uses.
      E2E_BASE_URL: http://localhost:3000
      E2E_DATABASE_URL: postgres://app:app@localhost:5432/course_scheduling
      E2E_BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-32bytes

    steps:
      - uses: actions/checkout@v4

      # Host Node toolchain for the Playwright E2E suite (npm — matches Dockerfile/package-lock,
      # NOT pnpm, even though package.json declares packageManager: pnpm for local dev).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/scheduling/package-lock.json

      - name: Install deps (host)
        run: npm ci --no-audit --no-fund

      # H5: tenant-isolation guard — three rules, all three red on violation: (1) raw
      # `db.{select,insert,update,delete,execute}(` or `db.query.*` outside the forTenant spine /
      # audited allowlist; (2) app code importing `@/db/admin` (the BYPASSRLS superuser client);
      # (3) a hand-rolled `postgres(...)` under src/ without RLS_ROLE_OPTIONS.
      # Postgres RLS IS enabled (migration 0026, ADR 0003) — this guard is not a stand-in for it.
      # The two fail at different times: the guard before merge, RLS at execution. RLS also fails
      # silently on reads (0 rows), which is exactly why the pre-merge half still earns its keep.
      # It validates every ALLOWLIST entry with existsSync, so it fails LOUDLY (exit 1, listing
      # the missing entries) if run from the wrong directory rather than silently passing.
      - name: Tenant-isolation guard
        run: npx tsx scripts/check-tenant-db-access.ts

      # ESLint — this app had no lint step at all until now. Placed here because it costs ~6s,
      # i.e. it fails before the Playwright download and the two docker builds below.
      #
      # `--max-warnings=0` lives in the package.json `lint` script rather than in this step, so
      # that the prescribed pre-commit gate (`npm run check` — root CLAUDE.md § 命令速查, this
      # app's README.md § Validation and CLAUDE.md § 命令; NOT any AGENTS.md) and this
      # job reject the same input. It is the whole point of the step: eslint exits 0 on warnings,
      # so a bare `eslint .` would be decoration — fcac42d removed two unused bare-`db` imports
      # that had been warning for weeks precisely because `npm run check` stayed green. Cost of
      # putting it in the script: a warning mid-edit now blocks local `check` too; run
      # `npx eslint .` while iterating. Baseline on main is 0 warnings.
      #
      # Lint is NOT part of the docker builds below — Next 16 dropped build-time ESLint
      # (`next lint` is gone), so this step is the only thing that runs it in CI at all.
      - name: Lint
        run: npm run lint

      # Typecheck, even though the docker build below runs `next build` with
      # `typescript: { ignoreBuildErrors: false }` over the same file set (tsconfig `include` is
      # `**/*.ts(x)`). Not redundant: Next THROWS AWAY test-file diagnostics before deciding to
      # fail — node_modules/next/dist/lib/typescript/runTypeCheck.js filters `allDiagnostics`
      # through /[\\/]__(?:tests|mocks)__[\\/]|(?<=[\\/.])(?:spec|test)\.[^\\/]+$/, which exempts
      # all 119 of this app's `tests/**/*.test.ts` + `tests/e2e/**/*.spec.ts`. Nothing else here
      # covered them either: vitest.config.ts sets no `test.typecheck` (esbuild transpiles without
      # checking) and Playwright is the same, so until this step a type error in a test file
      # reached main with no gate at all. Costs ~5s (`tsc --noEmit --incremental false` measured
      # 4.6s on a checkout with no `.next/`, i.e. this job's exact state), same order as lint.
      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both builds share one cache scope on purpose: the `test` target's layers are a superset of
      # `build`, and `runtime` re-exports most of them, so separate scopes would store the same
      # blobs twice. mode=min (not max) because GitHub's Actions cache is a 10 GB PER-REPOSITORY
      # hard cap that money cannot raise — and this repo now hosts two apps. With mode=max the two
      # apps' release layers evicted each other, and the LRU victim was whichever ref is touched
      # least often, i.e. the release branches that go straight to production.
      #
      # Only `main` writes it. The `cache-to` guard below tests `github.ref`, not the event name,
      # because GHA cache entries are REF-SCOPED: a write from `prod-scheduling` or from a
      # workflow_dispatch on a topic branch is not readable by main's runs anyway — it would just
      # park a second copy of the same layers inside that same 10 GB. So PRs, the release branch
      # and topic-branch dispatches all read and never write, and none of them can evict main's
      # warm layers.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/scheduling
          target: test
          load: true
          tags: app:test
          cache-from: type=gha,scope=scheduling
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=scheduling' || '' }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/scheduling
          target: runtime
          load: true
          tags: app:prod
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=scheduling
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,scope=scheduling' || '' }}

      # Migrate + run the vitest suite against the postgres service, inside the image.
      - name: Migrate + test (in-container)
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=test \
            app:test sh -c "node dist/migrate.mjs && npm run test"

      # Start the production image (backed by the same postgres service) for both the health smoke
      # and the Playwright E2E suite.
      - name: Start app (production image)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e BETTER_AUTH_URL="$BETTER_AUTH_URL" \
            -e NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            app:prod
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs app; exit 1

      # E2E: global-setup seeds the fixture tenant into the running app's DB and mints
      # storageState, then Playwright reuses the already-running app:prod on :3000.
      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduling-playwright-report
          path: |
            apps/scheduling/playwright-report/
            apps/scheduling/test-results/
          retention-days: 14

      - name: App logs on failure
        if: failure()
        run: docker logs app || true
