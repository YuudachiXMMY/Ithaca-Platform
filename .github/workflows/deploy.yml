# ── Build & Push the SvelteKit image to GHCR on the `prod` branch ──────────
# SvelteKit is the sole application at the repository ROOT (the legacy Next.js app
# and its `deploy.yml` were removed in the repo cleanup/reorg). This builds the app
# (adapter-node, self-migrating on start) from the repo root and publishes
# `ghcr.io/<repo>-kit`. The `-kit` image suffix is retained until the external deploy
# target is confirmed to pull the renamed `ghcr.io/<repo>` image.
name: Build & Deploy (SvelteKit)

on:
  push:
    branches: [prod]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-kit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      # PUBLIC_* are inlined into the client bundle at BUILD time (Vite), so they must be
      # passed as build-args here — a runtime-only value would be `undefined` in the browser.
      # PUBLIC_SITE_URL bakes every canonical/OG/hreflang/sitemap URL: keep it the real prod
      # origin (a staging value would point all SEO URLs at the wrong host).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PUBLIC_GA_TRACKING_ID=${{ vars.PUBLIC_GA_TRACKING_ID || 'G-675W5PPJEJ' }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://ithacateens.com' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
