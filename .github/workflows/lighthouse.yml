# ── Lighthouse CI — mobile perf gate ────────────
# Builds the SvelteKit app (adapter-node) and runs `lhci autorun` against the
# built site. The thresholds that actually block a merge live in lighthouserc.json
# and are, today, exactly two: LCP <= 4500ms and CLS <= 0.05. Everything else
# (performance 0.85, a11y 0.9, seo 0.9, FCP, TBT) is warn-level and cannot fail
# the job. The PRD's 2500ms LCP target is being reached by a staged per-route
# ratchet — see the "//assert" note in lighthouserc.json.
#
# Correctness, types, lint and unit tests are NOT checked here; that is ci.yml.
# PUBLIC_* env is inlined at build time.

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # No placeholder auth/DB env needed any more: the app is stateless, so neither `npm run build`
    # (which prerenders, importing hooks.server.ts) nor the lhci server (`node build/index.js`)
    # requires any env to load. Previously hooks.server.ts -> auth.ts ran betterAuth({ secret }) at
    # module load and threw BetterAuthError without one.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # engine-strict is off here (mirrors the Docker deps stage, which never copies .npmrc):
        # camera-controls@3.1.2 declares engines.node >=22, but it only needs 22 at the install-time
        # engine check, not at runtime, so the Node 20 runner (prod parity) builds fine. Without
        # this, .npmrc's engine-strict=true turns that mismatch into an EBADENGINE abort.
        run: npm ci --engine-strict=false

      - name: Build
        env:
          PUBLIC_GA_TRACKING_ID: G-675W5PPJEJ
          PUBLIC_SITE_URL: https://ithacateens.com
        run: npm run build

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
