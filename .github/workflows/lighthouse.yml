# ── Lighthouse CI — mobile perf gate ────────────
# Builds the SvelteKit app (adapter-node) and runs `lhci autorun` against the
# built site, asserting the PRD's headline metrics (Performance ≥ 0.95,
# LCP < 2.0s, CLS < 0.05). PUBLIC_* env is inlined at build time.

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # engine-strict is off here (mirrors the Docker deps stage, which never copies .npmrc):
        # camera-controls@3.1.2 declares engines.node >=22, but it only needs 22 at the install-time
        # engine check, not at runtime, so the Node 20 runner (prod parity) builds fine. Without
        # this, .npmrc's engine-strict=true turns that mismatch into an EBADENGINE abort.
        run: npm ci --engine-strict=false

      - name: Build
        env:
          PUBLIC_GA_TRACKING_ID: G-675W5PPJEJ
          PUBLIC_SITE_URL: https://ithacateens.com
        run: npm run build

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
